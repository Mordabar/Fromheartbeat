<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<body style="margin:0;background:#07040f;overflow:hidden">
<canvas id="c" style="position:fixed;inset:0;width:100%;height:100%;display:block"></canvas>
<script type="module">
// 3D-only harness: drives the Studio directly so scenes can be judged without the application around it.
import {Studio} from '../assets/studio.js';
import {buildContent} from '../assets/content.js';
const q = new URLSearchParams(location.search);
const money = n => new Intl.NumberFormat('es-CO', {style: 'currency', currency: 'COP', maximumFractionDigits: 0}).format(n / 100);
const boot = await (await fetch('../api.php?action=bootstrap')).json();
const s = window.studio = new Studio(document.getElementById('c'));
s.snapCamera = q.has('snap');
s.setContent(buildContent(boot, boot.tracks, money));
s.setFree([0, 0, innerWidth, innerHeight]);
if (q.get('mood')) s.tone(q.get('mood'));
const draft = {genre: q.get('genre') || '', mood: q.get('mood') || '', voice: q.get('voice') || '', language: 'Español', tempo: 'A tu criterio', recipient: q.get('to') || '', occasion: q.get('occ') || '', story: q.get('story') || '', product: q.get('product') || 'personalizada'};
s.setDraft(draft);
s.setTracks(boot.tracks);
if (q.get('play')) s.setPlaying(Number(q.get('play')));
s.moveTo(q.get('view') || 'lobby', true);
s.advance(Number(q.get('t') || 3));
document.title = 'ready';
</script>
