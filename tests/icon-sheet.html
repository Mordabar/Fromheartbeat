<!doctype html><meta charset="utf-8"><body style="margin:0;background:#0b0618;color:#cbb8f0;font:12px Manrope,Arial"><canvas id="c"></canvas>
<script type="module">
import {ICONS, drawIcon} from '../assets/icons.js';
const names = Object.keys(ICONS), cols = 12, cell = 116, rows = Math.ceil(names.length / cols);
const c = document.getElementById('c'); c.width = cols * cell; c.height = rows * cell;
const g = c.getContext('2d'); g.fillStyle = '#0b0618'; g.fillRect(0, 0, c.width, c.height);
const cols2 = ['#c6a2ff', '#ff4fd8', '#22e4ff', '#ffd23f', '#3dffc5', '#ff6a3d'];
names.forEach((n, i) => { const x = (i % cols) * cell + cell / 2, y = Math.floor(i / cols) * cell + 48;
  drawIcon(g, n, x, y, 64, {color: cols2[i % cols2.length], width: 1.8, glow: 10});
  g.fillStyle = '#9d8cc4'; g.font = '11px Arial'; g.textAlign = 'center'; g.fillText(n, x, y + 52); });
document.title = 'ready:' + names.length;
</script>
